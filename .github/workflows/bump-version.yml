name: Bump Plugin Version

on:
  push:
    branches:
      - main
    paths:
      - 'skills/**'
      - 'agents/**'
      - 'commands/**'
      - 'hooks/**'
      - '.mcp.json'
      - '.claude-plugin/**'

permissions:
  contents: write

concurrency:
  group: bump-plugin-version-main
  cancel-in-progress: false

jobs:
  bump-version:
    if: >-
      !startsWith(github.event.head_commit.message, 'chore(release): bump plugin version') &&
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Auto-increment patch version in .claude-plugin/plugin.json
        id: bump
        run: |
          node <<'EOF'
          const fs = require('fs');
          const { execSync } = require('child_process');

          const manifestPath = '.claude-plugin/plugin.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const currentVersion = manifest.version || '1.0.0';

          let previousVersion = null;
          try {
            const prevRaw = execSync(`git show HEAD~1:${manifestPath}`, {
              encoding: 'utf8',
              stdio: ['ignore', 'pipe', 'ignore'],
            });
            previousVersion = JSON.parse(prevRaw).version;
          } catch {
            // Initial commit or manifest did not exist in HEAD~1
          }

          if (previousVersion && previousVersion !== currentVersion) {
            console.log(`Version already manually updated (${previousVersion} -> ${currentVersion}). Skipping.`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'bumped=false\n');
            process.exit(0);
          }

          const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(currentVersion);
          if (!match) {
            throw new Error(`Unsupported version format in ${manifestPath}: "${currentVersion}" (expected X.Y.Z)`);
          }

          const nextVersion = `${match[1]}.${match[2]}.${Number(match[3]) + 1}`;
          manifest.version = nextVersion;
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n', 'utf8');

          console.log(`Bumped plugin version: ${currentVersion} -> ${nextVersion}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `bumped=true\nversion=${nextVersion}\n`);
          EOF

      - name: Commit and push updated plugin.json
        if: steps.bump.outputs.bumped == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json
          git commit -m "chore(release): bump plugin version to v${{ steps.bump.outputs.version }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
